[package]
name = "wombatkv-dst"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Deterministic simulation testing (DST) primitives for WombatKV. Draws on the DST patterns shipped in the myelon crate (github.com/Venkat2811/myelon)."

[lib]
name = "wombatkv_dst"

[[bin]]
name = "wombatkv-dst-runner"
path = "src/bin/wombatkv_dst_runner.rs"

[[bin]]
name = "wombatkv-dst-runner-child"
path = "src/bin/wombatkv_dst_runner_child.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
