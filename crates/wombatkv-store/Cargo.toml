[package]
name = "wombatkv-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Object-store backend (S3 / MinIO / R2 / GCS) for WombatKV. Async writes, sync reads, per-namespace LRU eviction with CAS safety."
documentation = "https://docs.rs/wombatkv-store"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
http = "0.2"
serde_json = "1.0"
s3 = { package = "rust-s3", version = "0.35.1", default-features = false, features = ["use-tokio-native-tls"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time"] }
wombatkv-format = { path = "../wombatkv-format", version = "0.1.0-alpha.pre1.0" }

[lints]
workspace = true
