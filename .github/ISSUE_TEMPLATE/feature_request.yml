name: Feature request
description: Suggest an addition or change to the public API.
title: "feature: "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: crate
    attributes:
      label: Which crate?
      options:
        - wombatkv-cabi
        - wombatkv-daemon
        - wombatkv-node
        - wombatkv-radix
        - wombatkv-store
        - wombatkv-format
        - wombatkv-core
        - workspace / tooling
        - other
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to accomplish that the current API can't?
    validations:
      required: true
  - type: textarea
    id: proposed-api-shape
    attributes:
      label: Proposed API shape
      description: Sketch a function signature, C ABI symbol, env var, or builder call.
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
  - type: input
    id: engine
    attributes:
      label: Engine integration context (if applicable)
      placeholder: "ds4 / llama.cpp / vLLM / SGLang / Ollama / other"
